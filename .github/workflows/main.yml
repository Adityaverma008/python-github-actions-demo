name: Python CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-test:

    runs-on: ubuntu-latest

    steps:

      # Download source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dependencies
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # Run tests
      - name: Execute Tests
        run: |
          python -m pytest

  deploy:

    needs: build-test

    runs-on: ubuntu-latest

    steps:

      # Download source code
      - uses: actions/checkout@v4

      # Login Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/python-demo:latest .

      # Push Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/python-demo:latest
